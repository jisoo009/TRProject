<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save Memories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<main class="app">

    <!-- 1. 시작 화면 -->
    <section id="home-screen" class="screen home-screen">
        <div class="home-content">
            <h1 class="brand-title">
                <span class="brand-save">Save</span>
                <span class="brand-memories">Memories</span>
            </h1>

            <button type="button" class="primary-button" data-go="login">
                시작하기
            </button>
        </div>
    </section>

    <!-- 2. 로그인 화면 -->
    <section id="login-screen" class="screen" hidden>
        <div class="form-panel has-icon">
            <svg class="panel-icon" viewBox="0 0 130 110" aria-hidden="true">
                <g transform="rotate(-20 58 62)">
                    <path d="M40 34 L47 20 Q48 18 51 18 H69 Q72 18 73 20 L80 34 Z" fill="#d8b8ff"/>
                    <rect x="18" y="32" width="80" height="54" rx="11" fill="#d8b8ff"/>
                    <circle cx="58" cy="59" r="17" fill="#d8b8ff" stroke="#e5f1ff" stroke-width="6"/>
                    <circle cx="30" cy="44" r="3.2" fill="#e5f1ff"/>
                </g>
                <path d="M97 10 L89 27 M112 20 L98 31" stroke="#000" stroke-width="5.5" stroke-linecap="round" fill="none"/>
            </svg>

            <h2>로그인</h2>

            <form id="login-form">
                <input id="login-email" name="email" type="email"
                    placeholder="이메일" aria-label="이메일"
                    autocomplete="email" required>

                <input id="login-password" name="password" type="password"
                    placeholder="비밀번호" aria-label="비밀번호"
                    autocomplete="current-password" required>

                <button type="submit" class="primary-button">로그인</button>
            </form>

            <p class="form-footer">
                아직 회원이 아니신가요?
                <button type="button" class="text-button" data-go="register">회원가입</button>
            </p>

            <button type="button" class="back-button" data-go="home">← 처음으로</button>
        </div>
    </section>

    <!-- 3. 회원가입 화면 -->
    <section id="register-screen" class="screen" hidden>
        <div class="form-panel has-icon">
            <svg class="panel-icon round" viewBox="0 0 100 100" aria-hidden="true">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#d8b8ff" stroke-width="7"/>
                <circle cx="50" cy="38" r="15" fill="#d8b8ff"/>
                <path d="M20 79 Q22 58 50 58 Q78 58 80 79 A43 43 0 0 1 20 79 Z" fill="#d8b8ff"/>
            </svg>

            <h2>회원가입</h2>

            <form id="register-form">
                <input id="register-nickname" name="nickname" type="text"
                    placeholder="닉네임" aria-label="닉네임"
                    maxlength="50" autocomplete="nickname" required>

                <input id="register-email" name="email" type="email"
                    placeholder="이메일" aria-label="이메일"
                    autocomplete="email" required>

                <input id="register-password" name="password" type="password"
                    placeholder="비밀번호 (8자 이상)" aria-label="비밀번호"
                    minlength="8" autocomplete="new-password" required>

                <button type="submit" class="primary-button">회원가입</button>
            </form>

            <p class="form-footer">
                이미 회원이신가요?
                <button type="button" class="text-button" data-go="login">로그인</button>
            </p>

            <button type="button" class="back-button" data-go="home">← 처음으로</button>
        </div>
    </section>

    <!-- 4~7. 로그인 이후 화면 (Home / Room / Calender / Picture) -->
    <section id="main-screen" class="screen app-screen" hidden>

        <header class="topbar">
            <button type="button" id="menu-button" class="menu-button" aria-label="메뉴" aria-expanded="false">
                <svg viewBox="0 0 30 24" width="30" height="24" aria-hidden="true">
                    <path d="M1 3 H29 M1 12 H29 M1 21 H29" stroke="#000" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </button>

            <nav class="tabs" aria-label="메인 메뉴">
                <button type="button" class="tab active" data-tab="home">Home</button>
                <button type="button" class="tab" data-tab="room">Room</button>
                <button type="button" class="tab" data-tab="calendar">Calender</button>
                <button type="button" class="tab" data-tab="picture">Picture</button>
            </nav>
        </header>

        <div id="menu-panel" class="menu-panel" hidden>
            <p id="menu-user" class="menu-user"></p>
            <button type="button" id="menu-logout" class="menu-logout">로그아웃</button>
        </div>

        <div class="tab-panels">

            <!-- Home: 내 방 목록 + 방 만들기(+) + 코드로 참여 -->
            <div id="tab-home" class="tab-panel">
                <div id="house-row" class="house-row">
                    <button type="button" id="create-room-button" class="plus-button" aria-label="방 만들기">
                        <svg viewBox="0 0 50 50" width="50" height="50" aria-hidden="true">
                            <path d="M25 4 V46 M4 25 H46" stroke="#868686" stroke-width="5.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>

                <form id="join-form" class="join-form">
                    <label for="join-code" class="join-label">공유받은 코드로 참여하기</label>
                    <div class="join-row">
                        <input id="join-code" type="text" maxlength="12"
                            placeholder="초대 코드 입력" autocomplete="off"
                            autocapitalize="characters" spellcheck="false">
                        <button type="submit" class="primary-button">참여</button>
                    </div>
                </form>
            </div>

            <!-- Room: 랜덤 코드 + 초대 링크 창 -->
            <div id="tab-room" class="tab-panel" hidden>
                <p id="room-empty" class="empty-hint">Home에서 방을 만들거나 선택해 주세요.</p>

                <div id="share-modal" class="modal-card" hidden>
                    <button type="button" id="modal-close" class="modal-close" aria-label="닫기">X</button>

                    <p class="modal-label">랜덤 코드</p>
                    <div class="yellow-box"><span id="share-code">------</span></div>
                    <button type="button" id="copy-code" class="copy-button">코드 복사</button>

                    <p class="modal-label">초대 링크</p>
                    <div class="yellow-box link"><span id="share-link"></span></div>
                    <button type="button" id="copy-link" class="copy-button">링크 복사</button>
                </div>
            </div>

            <!-- Calender: 되는 날짜 선택 -->
            <div id="tab-calendar" class="tab-panel" hidden>
                <p id="calendar-empty" class="empty-hint">Home에서 방을 만들거나 선택해 주세요.</p>

                <div id="calendar-area" hidden>
                    <p class="cal-hint">
                        되는 날짜를 눌러 선택하세요.<br>
                        모두 되는 날은 노랗게 표시돼요.
                    </p>

                    <div class="polaroid">
                        <div class="cal-sheet">
                            <div class="cal-box">
                                <div class="cal-head">
                                    <button type="button" id="cal-prev" class="cal-arrow" aria-label="이전 달">‹</button>
                                    <h3 class="cal-title"><span id="cal-month">OCTOBER</span> <small id="cal-year"></small></h3>
                                    <button type="button" id="cal-next" class="cal-arrow" aria-label="다음 달">›</button>
                                </div>
                                <div class="cal-rule"></div>

                                <div class="cal-grid cal-weekdays" aria-hidden="true">
                                    <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
                                </div>
                                <div id="cal-days" class="cal-grid"></div>
                            </div>
                        </div>
                    </div>

                    <ul id="cal-legend" class="legend"></ul>
                </div>
            </div>

            <!-- Picture: 방 사진 -->
            <div id="tab-picture" class="tab-panel" hidden>
                <p id="picture-empty" class="empty-hint">Home에서 방을 만들거나 선택해 주세요.</p>

                <div id="picture-area" hidden>
                    <div class="photo-toolbar">
                        <button type="button" id="photo-add" class="primary-button">+ 사진 올리기</button>
                        <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
                    </div>

                    <div class="polaroid">
                        <div class="cal-sheet">
                            <p id="photo-empty" class="photo-empty">아직 올린 사진이 없어요.</p>
                            <div id="photo-grid" class="photo-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
